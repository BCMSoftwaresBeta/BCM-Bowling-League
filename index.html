<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BCM Bowling League</title>
<style>
html,body{margin:0;min-height:100%;background:#0B1F36;color:#D0DFEC;font-family:system-ui,-apple-system,sans-serif}
#boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
#boot b{display:block;color:#E4C888;font-size:22px;margin-bottom:8px}
#boot span{opacity:.75}
</style>
</head>
<body>
<div id="boot"><div><b>BCM Bowling League</b><span>Loading Beta v0.2.3…</span></div></div>
<script>
(async()=>{
  try{
    const names=[
      'build/v023/build-01.part',
      'build/v023/build-02.part',
      'build/v023/build-03.part',
      'build/v023/build-04.part',
      'build/v023/build-05.part',
      'build/v023/build-06.part',
      'build/v023/build-07.part',
      'build/v023/build-08.part',
      'build/v023/build-09.part'
    ];
    const pieces=await Promise.all(names.map(n=>
      fetch(n+'?v=023').then(r=>{
        if(!r.ok) throw new Error('Failed to load '+n);
        return r.text();
      })
    ));
    const b64=pieces.join('').trim();
    const binary=atob(b64);
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
    if(typeof DecompressionStream==='undefined'){
      throw new Error('This browser does not support the required decompression feature.');
    }
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    console.error(err);
    document.getElementById('boot').innerHTML='<div><b>BCM Bowling League failed to load.</b><span>Refresh the page. If this keeps happening, send the error to ChatGPT.</span></div>';
  }
})();
</script>
</body>
</html>
