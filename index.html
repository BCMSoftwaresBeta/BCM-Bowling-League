<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BCM Bowling League</title>
<style>
html,body{margin:0;min-height:100%;background:#0B1F36;color:#D0DFEC;font-family:system-ui,-apple-system,sans-serif}
#boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
#boot b{display:block;color:#E4C888;font-size:22px;margin-bottom:8px}
#boot span{opacity:.75;line-height:1.5}
</style>
</head>
<body>
<div id="boot"><div><b>BCM Bowling League</b><span>Loading Beta v0.2.3…</span></div></div>
<script>
(async()=>{
  try{
    const names=[
      'build/v023/build-01.part','build/v023/build-02.part','build/v023/build-03.part',
      'build/v023/build-04.part','build/v023/build-05.part','build/v023/build-06.part',
      'build/v023/build-07.part','build/v023/build-08.part','build/v023/build-09.part'
    ];
    const pieces=[];
    for(const n of names){
      const r=await fetch(n+'?v=0232');
      if(!r.ok) throw new Error('Failed to load '+n+' ('+r.status+')');
      pieces.push((await r.text()).trim());
    }
    const binary=atob(pieces.join(''));
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
    let html='';
    if(typeof DecompressionStream!=='undefined'){
      const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      html=await new Response(stream).text();
    }else{
      await new Promise((resolve,reject)=>{
        const s=document.createElement('script');
        s.src='https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js';
        s.onload=resolve;s.onerror=()=>reject(new Error('Could not load decompression fallback'));
        document.head.appendChild(s);
      });
      html=window.pako.ungzip(bytes,{to:'string'});
    }
    if(!html.includes('BCM Bowling League')) throw new Error('Build package decoded incorrectly');
    document.open();document.write(html);document.close();
  }catch(err){
    console.error(err);
    document.getElementById('boot').innerHTML='<div><b>BCM Bowling League failed to load.</b><span>'+String(err.message||err)+'<br><br>Send this exact message to ChatGPT.</span></div>';
  }
})();
</script>
</body>
</html>
